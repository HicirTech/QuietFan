name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Inno Setup
        run: choco upgrade innosetup --no-progress --yes

      - name: Build, test and package
        env:
          TAG: ${{ github.ref_name }}
        run: ./build.ps1 -Version $env:TAG.Substring(1) -Test -Installer -Package

      - name: Install and uninstall smoke test
        run: ./tests/Test-Installer.ps1

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          gh release create $env:TAG --verify-tag --title "QuietFan $version" --notes-file dist/release-notes.md `
            "dist/QuietFan-Setup-$version.exe" "dist/QuietFan-$version-portable.zip" dist/SHA256SUMS.txt
